<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" aria-labelledby="title desc" viewBox="0 0 820 470"><desc id="desc">Agent 依次思考、行动和观察，再根据退出条件决定输出最终结果或继续下一轮循环。</desc><defs><marker id="arrow-dark" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><path fill="#333" d="m0 0 9 3.5L0 7z"/></marker><marker id="arrow-light" markerHeight="7" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="3.5"><path fill="#777" d="m0 0 9 3.5L0 7z"/></marker><style>.sans{font-family:Lato,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Droid Sans&quot;,&quot;Helvetica Neue&quot;,sans-serif}.code{font-family:&quot;JetBrains Maple Mono&quot;,Menlo,Consolas,ui-monospace,monospace}.heading{fill:#333;font-size:16px;font-weight:700}.body{fill:#333;font-size:15px}.note{fill:#666;font-size:14px}.box,.flow{stroke:#333;stroke-width:2}.flow{fill:none;marker-end:url(#arrow-dark)}</style></defs><path fill="#fff" d="M0 0h820v470H0z"/><rect width="210" height="96" x="45" y="70" fill="#e8e8e8" class="box" rx="8"/><text x="60" y="95" class="sans heading" dominant-baseline="middle">① 思考（Reasoning）</text><rect width="180" height="38" x="60" y="112" fill="#fff" stroke="#777" rx="5"/><text x="150" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">&quot;还需更多信息&quot;</text><rect width="210" height="96" x="305" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="320" y="95" class="sans heading" dominant-baseline="middle">② 行动（Acting）</text><rect width="180" height="38" x="320" y="112" fill="#fff" stroke="#777" rx="5"/><text x="410" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">web_search(...)</text><rect width="210" height="96" x="565" y="70" fill="#f0f0f0" class="box" rx="8"/><text x="580" y="95" class="sans heading" dominant-baseline="middle">③ 观察（Observing）</text><rect width="180" height="38" x="580" y="112" fill="#fff" stroke="#777" rx="5"/><text x="670" y="132" class="code body" dominant-baseline="middle" text-anchor="middle">tool_result: &quot;...&quot;</text><path d="M255 118h47" class="flow"/><path d="M515 118h47" class="flow"/><path d="M670 166v41" class="flow"/><rect width="430" height="145" x="45" y="220" fill="#fff" stroke="#777" stroke-dasharray="7 4" stroke-width="2" rx="8"/><text x="65" y="244" class="sans heading" dominant-baseline="middle">退出条件（任一满足）</text><path stroke="#ccc" d="M65 258h390"/><text x="65" y="282" class="sans body" dominant-baseline="middle">①
        任务完成</text><text x="250" y="282" class="sans body" dominant-baseline="middle">② 调用 final_answer</text><text x="65" y="314" class="sans body" dominant-baseline="middle">③ 无工具调用返回</text><text x="250" y="314" class="sans body" dominant-baseline="middle">④ 错误次数超限</text><text x="65" y="346" class="sans body" dominant-baseline="middle">⑤
        达到最大轮次</text><path fill="none" stroke="#777" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-light)" d="M475 260h112"/><rect width="62" height="20" x="502" y="238" fill="#fff" rx="3"/><text x="533" y="248" class="sans note" dominant-baseline="middle" text-anchor="middle">判断依据</text><path fill="#e2e2e2" d="m670 208 80 52-80 52-80-52z" class="box"/><text x="670" y="252" class="sans heading" dominant-baseline="middle" text-anchor="middle">满足退出</text><text x="670" y="273" class="sans heading" dominant-baseline="middle" text-anchor="middle">条件？</text><path d="M750 260h45V35H150v32" class="flow"/><text x="765" y="245" class="sans note" dominant-baseline="middle">否</text><rect width="120" height="22" x="360" y="43" fill="#fff" rx="3"/><text x="420" y="54" class="sans note" dominant-baseline="middle" text-anchor="middle">继续下一轮循环</text><path d="M670 312v67" class="flow"/><text x="685" y="346" class="sans note" dominant-baseline="middle">是</text><rect width="230" height="68" x="555" y="382" fill="#d6d6d6" class="box" rx="8"/><text x="670" y="416" class="sans heading" dominant-baseline="middle" text-anchor="middle">输出最终结果</text></svg>