<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" style="background:#fff" viewBox="0 0 820 660"><defs><marker id="a" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><path fill="#d69e00" d="m0 0 12 4L0 8z"/></marker><marker id="b" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><path fill="#d45d3d" d="m0 0 12 4L0 8z"/></marker></defs><text x="35" y="35" fill="#333" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold">request context:</text><rect width="525" height="82" x="50" y="58" fill="#eee" stroke="#999" stroke-width="1.5" rx="6"/><text x="66" y="82" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;system&quot;, content:</text><text x="82" y="105" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">&quot;你是 Claude Code 助手...</text><text x="82" y="127" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">&lt;available_skills&gt;pdf, pptx, ...&lt;/available_skills&gt;&quot; }</text><path stroke="#d69e00" stroke-width="2" marker-end="url(#a)" d="M635 99h-50"/><text x="648" y="80" fill="#b58100" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">Ⓐ Skill 元数据目录</text><text x="648" y="101" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">会话启动时加载</text><text x="648" y="120" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">属于 system prompt</text><rect width="525" height="45" x="50" y="150" fill="#eee" stroke="#999" stroke-width="1.5" rx="6"/><text x="66" y="173" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">tools: [Read, Bash, Edit, Write, ...]</text><path fill="none" stroke="#999" stroke-width="1.5" d="M590 58c25 0 25 17 35 37-10 20-10 100-35 100"/><text x="648" y="160" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">稳定启动前缀</text><text x="648" y="180" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">可复用 Prompt Cache</text><rect width="525" height="45" x="50" y="218" fill="#dcecf7" stroke="#8aa9bd" stroke-width="1.5" rx="6"/><text x="66" y="241" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;user&quot;, content: &quot;帮我从这个 PDF 生成 PPT&quot; }</text><rect width="525" height="84" x="50" y="278" fill="#fde2d7" stroke="#d45d3d" stroke-width="2" rx="6"/><text x="66" y="302" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;user&quot;, isMeta: true, content:</text><text x="82" y="325" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">&quot;Base directory: ...\n# PPTX Skill</text><text x="82" y="348" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">## Workflow: 1. Use markitdown...&quot; }</text><path stroke="#d45d3d" stroke-width="2" marker-end="url(#b)" d="M635 320h-50"/><text x="648" y="300" fill="#b84c31" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="bold">Ⓑ Skill 完整内容</text><text x="648" y="321" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">调用时才加载</text><text x="648" y="340" fill="#666" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">进入会话历史</text><rect width="525" height="45" x="50" y="382" fill="#dff1df" stroke="#8dad8d" stroke-width="1.5" rx="6"/><text x="66" y="405" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;assistant&quot;, tool_calls: [Read(&quot;input.pdf&quot;)] }</text><rect width="525" height="45" x="50" y="437" fill="#fff7df" stroke="#b8a982" stroke-width="1.5" rx="6"/><text x="66" y="460" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;tool&quot;, content: &quot;...PDF 文本内容...&quot; }</text><rect width="525" height="45" x="50" y="492" fill="#dff1df" stroke="#8dad8d" stroke-width="1.5" rx="6"/><text x="66" y="515" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;assistant&quot;, tool_calls: [Write(&quot;slides.html&quot;)] }</text><rect width="525" height="45" x="50" y="547" fill="#fff7df" stroke="#b8a982" stroke-width="1.5" rx="6"/><text x="66" y="570" fill="#333" font-family="'Courier New', Courier, monospace" font-size="13">{ role: &quot;tool&quot;, content: &quot;Wrote 12345 bytes&quot; }</text><text x="35" y="615" fill="#333" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold">]</text><rect width="720" height="24" x="50" y="626" fill="#f5f5f5" rx="4"/><text x="410" y="638" fill="#555" dominant-baseline="central" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" text-anchor="middle">以 Claude Code / Anthropic 实现为例：元数据从启动时就在 system prompt；完整指令在调用点按需加入会话。</text></svg>