<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" style="background:#fff" viewBox="0 40 900 340"><defs><marker id="a" markerHeight="8" markerWidth="12" orient="auto" refX="12" refY="4"><path fill="#333" d="m0 0 12 4L0 8z"/></marker></defs><rect width="370" height="46" x="30" y="44" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="58" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">非智能体化 RAG</text><text x="215" y="78" fill="#666" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">固定前置步骤，一次性检索</text><rect width="270" height="44" x="80" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="132" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">用户查询</text><path stroke="#333" stroke-width="2" marker-end="url(#a)" d="M215 156v18"/><rect width="270" height="44" x="80" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="196" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">检索（一次）</text><path stroke="#333" stroke-width="2" marker-end="url(#a)" d="M215 220v18"/><rect width="270" height="44" x="80" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="215" y="260" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">直接生成答案</text><rect width="370" height="46" x="500" y="44" fill="#eef3f6" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="58" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">智能体化 RAG（Agentic）</text><text x="685" y="78" fill="#666" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agent 用 ReAct 主导，迭代检索</text><rect width="310" height="44" x="530" y="110" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="132" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">思考：分析需求、定关键词</text><path stroke="#333" stroke-width="2" marker-end="url(#a)" d="M685 156v18"/><rect width="310" height="44" x="530" y="174" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="196" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">行动：调用检索工具</text><path stroke="#333" stroke-width="2" marker-end="url(#a)" d="M685 220v18"/><rect width="310" height="44" x="530" y="238" fill="#f0f0f0" stroke="#333" stroke-width="2" rx="6"/><text x="685" y="260" fill="#333" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="16" text-anchor="middle">观察：信息是否充分？</text><path stroke="#333" stroke-dasharray="8,4" stroke-width="2" d="M840 260h18m0 0v-64"/><path stroke="#333" stroke-dasharray="8,4" stroke-width="2" marker-end="url(#a)" d="M858 196h-18"/><text x="862" y="228" fill="#666" dominant-baseline="central" font-family="Lato, BlinkMacSystemFont, 'Segoe UI', 'Droid Sans', 'Helvetica Neue', sans-serif" font-size="14">不够</text><path stroke="#333" stroke-width="2" marker-end="url(#a)" d="M685 302v18"/><rect width="270" height="44" x="5